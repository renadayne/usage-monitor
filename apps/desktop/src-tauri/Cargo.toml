[package]
name = "usage-monitor-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
desktop-shell = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
collector = { path = "../../../crates/collector" }
normalized-schema = { path = "../../../crates/normalized-schema" }
adapters = { path = "../../../crates/adapters" }
policy-engine = { path = "../../../crates/policy-engine" }
setup-plan = { path = "../../../crates/setup-plan" }
observer-runtime = { path = "../../../crates/observer-runtime" }
observer-helper = { path = "../../../crates/observer-helper" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "2", optional = true }
