name: Workspace checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    name: Windows desktop executable
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.0'
      - name: Build embedded frontend
        working-directory: apps/desktop
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/generate-icon.mjs
          npm run build
      - name: Install tested native Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Restore native build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: windows-native-1.99.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-native-1.99.1-
      - name: Build native shell and hook helper
        run: cargo +1.99.1 build -p usage-monitor-desktop -p observer-helper --release --features usage-monitor-desktop/desktop-shell,usage-monitor-desktop/custom-protocol --locked
      - name: Upload portable executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usage-monitor-windows-x64
          path: |
            target/release/usage-monitor-desktop.exe
            target/release/aum-observer.exe
          if-no-files-found: error
          retention-days: 7
  frontend:
    name: Frontend / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.0'
      - run: npm ci --ignore-scripts
      - run: npm run test
      - run: npm run build
  rust:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tested Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.99.1 fmt --all -- --check
      - name: Test workspace
        run: cargo +1.99.1 test --workspace --locked
      - name: Lint workspace
        run: cargo +1.99.1 clippy --workspace --all-targets --locked -- -D warnings
